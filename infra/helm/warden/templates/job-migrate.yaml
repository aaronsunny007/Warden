apiVersion: batch/v1
kind: Job
metadata:
  # A regular Job, not a Helm hook: `helm install --wait` waits for every pod to be ready before it runs
  # post-install hooks, and the gateway/control-plane pods wait for the schema this Job creates, so a hook
  # would deadlock. The revision in the name gives each upgrade a fresh Job (a Job's spec is immutable);
  # Helm prunes the previous one. It retries until postgres accepts connections.
  name: {{ include "warden.fullname" . }}-migrate-{{ .Release.Revision }}
  labels: {{- include "warden.labels" . | nindent 4 }}
spec:
  backoffLimit: 10
  template:
    metadata:
      labels: {{- include "warden.selectorLabels" (dict "root" . "component" "migrate") | nindent 8 }}
    spec:
      restartPolicy: OnFailure
      containers:
        - name: migrate
          image: "{{ .Values.images.python.repository }}:{{ .Values.images.python.tag }}"
          imagePullPolicy: {{ .Values.pullPolicy }}
          command: ["sh", "-c"]
          args:
            - |
              echo "waiting for postgres"
              until python -c "import os; from sqlalchemy import create_engine; create_engine(os.environ['WARDEN_DATABASE_URL']).connect().close()" 2>/dev/null; do sleep 2; done
              cd /app && python -m alembic upgrade head
          env:
            - { name: WARDEN_DATABASE_URL, value: {{ include "warden.pyDatabaseUrl" . | quote }} }
