{{- if .Values.postgres.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "warden.fullname" . }}-postgres
  labels: {{- include "warden.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: {{- include "warden.selectorLabels" (dict "root" . "component" "postgres") | nindent 6 }}
  template:
    metadata:
      labels: {{- include "warden.selectorLabels" (dict "root" . "component" "postgres") | nindent 8 }}
    spec:
      containers:
        - name: postgres
          image: "{{ .Values.images.postgres.repository }}:{{ .Values.images.postgres.tag }}"
          imagePullPolicy: {{ .Values.pullPolicy }}
          env:
            - { name: POSTGRES_USER, value: {{ .Values.postgres.auth.username | quote }} }
            - { name: POSTGRES_PASSWORD, value: {{ .Values.postgres.auth.password | quote }} }
            - { name: POSTGRES_DB, value: {{ .Values.postgres.auth.database | quote }} }
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
          ports: [{ containerPort: 5432 }]
          readinessProbe:
            exec: { command: ["pg_isready", "-U", {{ .Values.postgres.auth.username | quote }}, "-d", {{ .Values.postgres.auth.database | quote }}] }
            initialDelaySeconds: 5
            periodSeconds: 5
          resources: {{- toYaml .Values.postgres.resources | nindent 12 }}
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
      volumes:
        - name: data
        {{- if .Values.postgres.persistence.enabled }}
          persistentVolumeClaim: { claimName: {{ include "warden.fullname" . }}-postgres }
        {{- else }}
          emptyDir: {}
        {{- end }}
{{- if .Values.postgres.persistence.enabled }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "warden.fullname" . }}-postgres
  labels: {{- include "warden.labels" . | nindent 4 }}
spec:
  accessModes: [ReadWriteOnce]
  resources: { requests: { storage: {{ .Values.postgres.persistence.size }} } }
{{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels: {{- include "warden.labels" . | nindent 4 }}
spec:
  selector: {{- include "warden.selectorLabels" (dict "root" . "component" "postgres") | nindent 4 }}
  ports: [{ port: 5432, targetPort: 5432 }]
{{- end }}
{{- if .Values.redis.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "warden.fullname" . }}-redis
  labels: {{- include "warden.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels: {{- include "warden.selectorLabels" (dict "root" . "component" "redis") | nindent 6 }}
  template:
    metadata:
      labels: {{- include "warden.selectorLabels" (dict "root" . "component" "redis") | nindent 8 }}
    spec:
      containers:
        - name: redis
          image: "{{ .Values.images.redis.repository }}:{{ .Values.images.redis.tag }}"
          imagePullPolicy: {{ .Values.pullPolicy }}
          args: ["redis-server", "--save", "", "--appendonly", "no"]
          ports: [{ containerPort: 6379 }]
          readinessProbe:
            exec: { command: ["redis-cli", "ping"] }
            initialDelaySeconds: 2
            periodSeconds: 5
          resources: {{- toYaml .Values.redis.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  labels: {{- include "warden.labels" . | nindent 4 }}
spec:
  selector: {{- include "warden.selectorLabels" (dict "root" . "component" "redis") | nindent 4 }}
  ports: [{ port: 6379, targetPort: 6379 }]
{{- end }}
