apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "warden.fullname" . }}-gateway
  labels: {{- include "warden.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.gateway.replicas }}
  selector:
    matchLabels: {{- include "warden.selectorLabels" (dict "root" . "component" "gateway") | nindent 6 }}
  template:
    metadata:
      labels: {{- include "warden.selectorLabels" (dict "root" . "component" "gateway") | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap-gateway.yaml") . | sha256sum }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        # Generate a dev signing key and sign the baseline (shadow mode) into a shared volume.
        - name: policy-init
          image: "{{ .Values.images.node.repository }}:{{ .Values.images.node.tag }}"
          imagePullPolicy: {{ .Values.pullPolicy }}
          command: ["sh", "/etc/warden/init-policy.sh"]
          volumeMounts:
            - { name: policy, mountPath: /policy }
            - { name: config, mountPath: /etc/warden }
        {{- include "warden.waitForSchema" . | nindent 8 }}
      containers:
        - name: gateway
          image: "{{ .Values.images.node.repository }}:{{ .Values.images.node.tag }}"
          imagePullPolicy: {{ .Values.pullPolicy }}
          command: ["node", "packages/gateway/dist/cli.js", "serve", "--config", "/etc/warden/warden.yaml"]
          env:
            {{- include "warden.adminTokenEnv" . | nindent 12 }}
            - { name: WARDEN_OTLP_ENDPOINT, value: {{ .Values.gateway.otlpEndpoint | quote }} }
          ports: [{ name: http, containerPort: 8787 }]
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 10
            periodSeconds: 10
          resources: {{- toYaml .Values.gateway.resources | nindent 12 }}
          volumeMounts:
            - { name: policy, mountPath: /policy, readOnly: true }
            - { name: config, mountPath: /etc/warden }
            - { name: verdicts, mountPath: /var/warden }
      volumes:
        - { name: policy, emptyDir: {} }
        - { name: verdicts, emptyDir: {} }
        - name: config
          configMap:
            name: {{ include "warden.fullname" . }}-gateway
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  labels: {{- include "warden.labels" . | nindent 4 }}
spec:
  type: {{ .Values.gateway.service.type }}
  selector: {{- include "warden.selectorLabels" (dict "root" . "component" "gateway") | nindent 4 }}
  ports:
    - { name: http, port: {{ .Values.gateway.service.port }}, targetPort: http }
