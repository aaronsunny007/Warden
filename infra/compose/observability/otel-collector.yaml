# Minimal OpenTelemetry collector: accept OTLP traces from the gateway over HTTP, log a summary,
# and re-expose a Prometheus endpoint so collector health is scrapeable.
receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch: {}

exporters:
  debug:
    verbosity: normal
  prometheus:
    endpoint: 0.0.0.0:8889

service:
  telemetry:
    metrics:
      level: basic
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug]
