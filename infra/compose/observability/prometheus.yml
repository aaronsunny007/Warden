# Scrapes Warden's Prometheus endpoints. The gateway exposes prom-client metrics at /metrics;
# the detection service exposes its cascade metrics at /metrics.
global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: warden-gateway
    static_configs:
      - targets: ['gateway:8787']
        labels: { component: gateway }

  - job_name: warden-detector
    static_configs:
      - targets: ['detector:8000']
        labels: { component: detector }

  - job_name: otel-collector
    static_configs:
      - targets: ['otel-collector:8889']
        labels: { component: otel-collector }

  # Only resolves when the `backend` profile is also running.
  - job_name: acme-backend
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['acme-backend:8081']
        labels: { component: acme-backend }
