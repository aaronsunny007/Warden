[project]
name = "warden"
version = "0.1.0"
description = "Warden: detection service, validation gate, learning loop and evaluation harness"
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "Sunny Aaron" }]
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.120",
  "uvicorn[standard]>=0.38",
  "pydantic>=2.11",
  "pydantic-settings>=2.10",
  "httpx>=0.28",
  "numpy>=2.2",
  "sqlalchemy>=2.0.40",
  "alembic>=1.16",
  "psycopg[binary]>=3.2",
  "pgvector>=0.4",
  "redis>=6.0",
  "prometheus-client>=0.22",
  "pyyaml>=6.0",
  "jsonschema>=4.24",
  "cryptography>=45",
]

[project.optional-dependencies]
agents = ["langgraph>=1.0", "langchain-core>=1.0", "langchain-ollama>=1.0", "mcp>=2.0"]
ml = ["sentence-transformers>=5.0", "onnxruntime>=1.22", "tokenizers>=0.21"]
kafka = ["aiokafka>=0.12"]
bench = ["agentdojo>=0.1.35"]
train = ["torch>=2.7", "transformers>=5.20.2", "datasets>=4.0", "scikit-learn>=1.7", "onnx>=1.18"]

[project.scripts]
warden = "warden.cli:main"

[dependency-groups]
dev = ["pytest>=8.4", "pytest-asyncio>=1.1", "hypothesis>=6.135", "mypy>=1.17", "ruff>=0.12", "types-PyYAML>=6.0", "types-jsonschema>=4.24"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/warden"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "BLE", "UP", "S", "SIM", "RUF", "N"]
ignore = ["E501", "S101", "S311", "RUF001", "RUF002", "RUF003", "S603", "S607"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B011"]
"scripts/**" = ["S"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
packages = ["warden"]

[[tool.mypy.overrides]]
module = ["pgvector.*", "sentence_transformers.*", "onnxruntime.*", "tokenizers.*", "aiokafka.*", "langgraph.*", "langchain_core.*", "langchain_ollama.*", "mcp.*", "agentdojo.*", "torch.*", "transformers.*", "datasets.*", "sklearn.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["integration: needs the Node gateway and lab built (pnpm build)"]
