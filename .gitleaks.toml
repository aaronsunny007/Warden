# Gitleaks configuration. Extends the default ruleset; no rule is disabled.
#
# Warden ships fake secrets on purpose: a canary token in the synthetic lab data, AWS's
# documented example key id, a base64 "hello world", and Slack/JWT test vectors for Warden's own
# secret detector. Each pattern below is the EXACT fake value, so a real credential anywhere is
# still reported, and the allowlist keeps working if history is squashed or rewritten.
#
# The singular [allowlist] table is used deliberately: gitleaks-action bundles an older gitleaks
# that ignores the newer [[allowlists]] syntax.
title = "warden gitleaks config"

[extend]
useDefault = true

[allowlist]
description = "Deliberate fake fixtures (exact values only)"
regexes = [
  '''WARDEN-CANARY-[A-Z0-9]{12}''',
  '''AKIAIOSFODNN7EXAMPLE''',
  '''aGVsbG8gd29ybGQ=''',
  '''xoxb-1234567890-abcdefghij''',
  '''eyJhbGciOiJIUzI1NiJ9\.eyJzdWIiOiIxMjM0NTY3ODkwIn0\.[A-Za-z0-9_-]+''',
]
