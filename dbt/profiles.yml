# Connection profile for the Warden analytics project. dbt reads DBT_* from the environment so no
# credentials live in the repo. For the compose/Helm Postgres the defaults below line up.
#
# Point dbt at this file with:  export DBT_PROFILES_DIR=$(pwd)
warden:
  target: dev
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('DBT_HOST', '127.0.0.1') }}"
      port: "{{ env_var('DBT_PORT', '5432') | int }}"
      user: "{{ env_var('DBT_USER', 'warden') }}"
      password: "{{ env_var('DBT_PASSWORD', 'warden') }}"
      dbname: "{{ env_var('DBT_DBNAME', 'warden') }}"
      schema: "{{ env_var('DBT_SCHEMA', 'analytics') }}"
      threads: 4
      sslmode: "{{ env_var('DBT_SSLMODE', 'prefer') }}"
